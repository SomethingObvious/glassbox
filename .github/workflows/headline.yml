name: Daily Headline

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: granite-3.0-1b-a400m-instruct
      - run: |
          pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          pip install transformers==5.12.1
      - run: python -m glassbox route --headline live/route.svg
      # The banner goes to its own branch so main keeps a readable history.
      - run: |
          cd live
          git init -q -b live
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add route.svg route.json
          git commit -q -m "Routed today's headline"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" live
      # GitHub turns off a public repo's schedules after 60 days without activity.
      # Re-enabling the workflow resets that clock without a commit.
      - run: gh workflow enable headline.yml --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ github.token }}
